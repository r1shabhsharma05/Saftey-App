name: Build SafeLife APK

on:
  workflow_dispatch:
  push:
    branches: [apk-build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Write runtime env (public client config only)
        run: |
          cat > mobile-app/.env <<'EOF'
          EXPO_PUBLIC_BACKEND_URL=https://safelife-backend-rish0000-dots-projects.vercel.app
          EXPO_PUBLIC_SUPABASE_URL=https://xkfrsjtfbylhhrvibmxk.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrZnJzanRmYnlsaGhydmlibXhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzODcwNDksImV4cCI6MjEwNzk2MzA0OX0.ypd-j8LROeCjqcTloC2qhUw73gJZA_Hd7fn6KtJSYPE
          EXPO_PUBLIC_API_SECRET=${{ secrets.EXPO_PUBLIC_API_SECRET }}
          EXPO_PUBLIC_MAPBOX_TOKEN=${{ secrets.EXPO_PUBLIC_MAPBOX_TOKEN }}
          EOF

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci --no-audit --no-fund

      - name: Prebuild Android project
        working-directory: mobile-app
        run: npx expo prebuild --platform android --no-install

      # The universal APK bundles native libs for all 4 ABIs
      # (armeabi-v7a, arm64-v8a, x86, x86_64) — Mapbox ships a large
      # .so per ABI, which is how the APK reached 201 MB. arm64-v8a
      # covers effectively every Android phone made since ~2015, so
      # ship that one ABI only and roughly halve the download. The
      # android/ dir is regenerated by prebuild each run, so the patch
      # lives here, not in a repo file. Output stays
      # app-release.apk — assembleRelease honors the filter.
      - name: Limit native libs to arm64-v8a (APK size)
        working-directory: mobile-app
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          if 'abiFilters' in s:
              print('abiFilters already present, skipping')
          else:
              m = re.search(r'defaultConfig\s*\{', s)
              assert m, 'defaultConfig block not found in android/app/build.gradle'
              block = "\n        ndk {\n            abiFilters 'arm64-v8a'\n        }"
              open(p, 'w').write(s[:m.end()] + block + s[m.end():])
              print('inserted arm64-v8a abiFilters into defaultConfig')
          PY
          grep -A2 'abiFilters' android/app/build.gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build release APK
        working-directory: mobile-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish APK as a GitHub release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "apk-${{ github.run_number }}" mobile-app/android/app/build/outputs/apk/release/app-release.apk --title "SafeLife AI test APK ${{ github.run_number }}" --notes "Release APK (debug-signed) built by GitHub Actions for on-device testing."
