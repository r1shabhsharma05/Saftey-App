<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="Animated SafeLife SOS flow: tap SOS, queue offline, backend validates and fans out, Telegram alerts guardians">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="0.45" stop-color="#F59E0B"/>
      <stop offset="0.7" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="960" height="260" rx="16" fill="url(#bg)"/>
  <text x="480" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#94A3B8">SOS FLOW — TAP TO TELEGRAM IN SECONDS</text>

  <!-- connecting line -->
  <line x1="150" y1="130" x2="810" y2="130" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <!-- travelling alert packet -->
  <circle r="7" fill="#38BDF8" stroke="#E0F2FE" stroke-width="1.5">
    <animateMotion dur="8s" repeatCount="indefinite" path="M150,130 L810,130"/>
  </circle>
  <circle r="11" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.5">
    <animateMotion dur="8s" repeatCount="indefinite" path="M150,130 L810,130"/>
    <animate attributeName="opacity" values="0.55;0.1;0.55" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- node halos (light up in sequence, 8s loop) -->
  <rect x="30" y="78" width="180" height="104" rx="14" fill="#EF4444">
    <animate attributeName="opacity" values="0.05;0.45;0.05" keyTimes="0;0.12;0.26" dur="8s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect x="270" y="78" width="180" height="104" rx="14" fill="#F59E0B">
    <animate attributeName="opacity" values="0.05;0.45;0.05" keyTimes="0;0.12;0.26" dur="8s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="510" y="78" width="180" height="104" rx="14" fill="#38BDF8">
    <animate attributeName="opacity" values="0.05;0.45;0.05" keyTimes="0;0.12;0.26" dur="8s" begin="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="750" y="78" width="180" height="104" rx="14" fill="#22C55E">
    <animate attributeName="opacity" values="0.05;0.45;0.05" keyTimes="0;0.12;0.26" dur="8s" begin="6s" repeatCount="indefinite"/>
  </rect>

  <!-- node 1: SOS trigger -->
  <g>
    <circle cx="120" cy="112" r="17" fill="#EF4444"/>
    <circle cx="120" cy="112" r="17" fill="none" stroke="#EF4444" stroke-width="2">
      <animate attributeName="r" values="17;28" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="120" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">SOS</text>
    <text x="120" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">1 · One tap</text>
    <text x="120" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94A3B8">GPS lock, last-known first</text>
  </g>

  <!-- node 2: offline queue -->
  <g>
    <circle cx="360" cy="112" r="17" fill="#F59E0B"/>
    <text x="360" y="117" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1F2937">⇅</text>
    <text x="360" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">2 · Offline queue</text>
    <text x="360" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94A3B8">No signal? Queued, then sent</text>
  </g>

  <!-- node 3: backend -->
  <g>
    <circle cx="600" cy="112" r="17" fill="#38BDF8"/>
    <text x="600" y="117" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#082F49">⚙</text>
    <text x="600" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">3 · Backend API</text>
    <text x="600" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94A3B8">Auth · limits · fan-out</text>
  </g>

  <!-- node 4: telegram -->
  <g>
    <circle cx="840" cy="112" r="17" fill="#22C55E"/>
    <text x="840" y="117" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#052E16">✈</text>
    <text x="840" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">4 · Telegram alert</text>
    <text x="840" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94A3B8">Guardians notified live</text>
  </g>

  <!-- footer -->
  <text x="480" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#64748B">Location keeps streaming while the alert is active · 15% battery warns · 5% sends a final pin</text>
  <text x="480" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Animated with SMIL — no JavaScript · SafeLife</text>
</svg>
